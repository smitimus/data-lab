name: grocery
version: '1.0.0'
config-version: 2

profile: grocery

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  grocery:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: mart
    intermediate:
      +materialized: table
      +schema: intermediate

tests:
  # Tiered gating (t_03a3b9fd): critical by default. Balance/FK/propagation
  # assertions FAIL the build. Soft expectations (ranges, value sets, known
  # upstream data-quality edges) must opt into `severity: warn` per test.
  +severity: error
