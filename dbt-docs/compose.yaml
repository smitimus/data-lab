# dbt Docs — Data catalog and lineage for dbt-managed models
# 260426 - initial setup: replaces OpenMetadata for lightweight discoverability
# 260713 - custom Dockerfile to match airflow-worker dbt version (1.11.12)

services:
  dbt-docs:
    container_name: dbt-docs
    build: .
    environment:
      TZ: ${TZ}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_PROFILES_DIR: /usr/app
      # Write dbt logs to container-local tmp. The shared project mount's logs/
      # is owned by airflow-worker's uid (50000); dbt-docs runs as 1000 and
      # crash-looped on PermissionError writing /usr/app/dbt/logs/dbt.log.
      # 260831 - fix dbt-docs restart loop
      DBT_LOG_PATH: /tmp/dbt-logs
    user: "${AIRFLOW_UID:-1000}:0"
    volumes:
      - ${STACKS}/airflow/dbt/grocery:/usr/app/dbt
      - ${STACKS}/dbt-docs/profiles.yml:/usr/app/profiles.yml:ro
    working_dir: /usr/app/dbt
    entrypoint:
      - bash
      - -c
      - "dbt deps && until dbt debug --quiet 2>/dev/null; do sleep 5; done && dbt docs generate && dbt docs serve --host 0.0.0.0 --port 8080"
    ports:
      - "${DBT_DOCS_PORT:-8082}:8080"
    restart: unless-stopped
    labels:
      - homepage.group=${HOMEPAGE_GROUP}
      - homepage.name=dbt Docs
      - homepage.icon=dbt.png
      - homepage.href=http://${IP}:${DBT_DOCS_PORT:-8082}/
      - homepage.description=Data catalog — dbt model lineage, columns, and tests
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true
    name: postgres_postgres_network
